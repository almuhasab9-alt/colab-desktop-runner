name: Release

# Manually triggered release pipeline:
# builds signed manifest + delta patches from the last releases and
# publishes a GitHub Release. The APK itself is built locally (signing
# keystore never lives in CI) and uploaded as workflow input artifact,
# OR a debug-signed APK can be built here for testing channels.
#
# SECRETS USED (repository Settings -> Secrets):
# - UPDATE_SIGNING_KEY_HEX : Ed25519 private key (64 hex chars).
#   Never printed, never stored in the repo.
# No other secrets. No keystore in CI.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name (e.g. 1.1.0)'
        required: true
      version_code:
        description: 'Version code (integer, must increase)'
        required: true
      serial:
        description: 'Manifest anti-replay serial (must increase)'
        required: true
      tag:
        description: 'Release tag (e.g. v1.1.0)'
        required: true
      notes_ar:
        description: 'Arabic release notes'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (pinned)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Tests must pass before any release
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Build release APK (CI-signed for beta/canary channels)
        # NOTE: without the production keystore this produces a
        # debug/CI-signed APK. For the stable channel, replace the
        # artifact with the locally-signed APK before publishing.
        run: flutter build apk --release || flutter build apk --debug

      - name: Locate APK
        id: apk
        run: |
          APK=$(ls build/app/outputs/flutter-apk/app-release.apk 2>/dev/null || ls build/app/outputs/flutter-apk/app-debug.apk)
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Install patch tooling
        run: pip install bsdiff4 cryptography

      - name: Download previous release APKs (last 3, for delta patches)
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          ARGS=""
          # list last 3 releases and pull their app-release.apk + versionCode from tag metadata file if present
          for TAG in $(gh release list --limit 3 --json tagName -q '.[].tagName' 2>/dev/null); do
            gh release download "$TAG" -p "app-release.apk" -O "prev/$TAG.apk" 2>/dev/null || continue
            CODE=$(gh release download "$TAG" -p "versioncode.txt" -O - 2>/dev/null || true)
            if [ -n "$CODE" ]; then
              ARGS="$ARGS --old-apk $CODE:prev/$TAG.apk"
            fi
          done
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Generate signed manifest + verified delta patches
        env:
          UPDATE_SIGNING_KEY_HEX: ${{ secrets.UPDATE_SIGNING_KEY_HEX }}
        run: |
          python3 tools/release_pipeline.py \
            --new-apk "${{ steps.apk.outputs.path }}" \
            --version-name "${{ inputs.version_name }}" \
            --version-code "${{ inputs.version_code }}" \
            --serial "${{ inputs.serial }}" \
            --repo "${{ github.repository }}" \
            --tag "${{ inputs.tag }}" \
            --notes-ar "${{ inputs.notes_ar }}" \
            ${{ steps.prev.outputs.args }} \
            --out dist
          cp "${{ steps.apk.outputs.path }}" dist/app-release.apk
          echo "${{ inputs.version_code }}" > dist/versioncode.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.tag }}" \
            --title "Colab Desktop Runner ${{ inputs.version_name }}" \
            --notes "${{ inputs.notes_ar }}" \
            dist/app-release.apk dist/latest.json dist/latest.json.sig \
            dist/SHA256SUMS.txt dist/versioncode.txt dist/*.bsdiff 2>/dev/null || \
          gh release create "${{ inputs.tag }}" \
            --title "Colab Desktop Runner ${{ inputs.version_name }}" \
            --notes "${{ inputs.notes_ar }}" \
            dist/app-release.apk dist/latest.json dist/latest.json.sig \
            dist/SHA256SUMS.txt dist/versioncode.txt
